[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ytdownloader"
version = "1.0.0"
description = "Desktop app for downloading video and audio"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Victor Medeiros" }]
maintainers = [{ name = "Victor Medeiros" }]
keywords = ["youtube", "downloader", "yt-dlp", "pyside6", "desktop"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "PySide6-Essentials>=6.8",
    "yt-dlp>=2025.1.1",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pyinstaller>=6.11",
]

[project.urls]
Homepage = "https://github.com/victorhuggomed2006-ux/YoutubeDownloader"
Source = "https://github.com/victorhuggomed2006-ux/YoutubeDownloader"
Issues = "https://github.com/victorhuggomed2006-ux/YoutubeDownloader/issues"

[project.gui-scripts]
ytdownloader = "ytdownloader.__main__:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
ytdownloader = ["resources/*.qss", "resources/*.svg", "resources/*.ico"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.coverage.run]
source = ["ytdownloader"]
# The interface is exercised by hand; measuring it here would be misleading.
omit = ["*/gui/*", "*/__main__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = [".", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplifications
    "RUF",  # ruff's own rules
    "PTH",  # prefira pathlib
    "S",    # bandit: security
]
ignore = [
    "E501",    # the formatter already handles line length
    "S101",    # assert is the natural way to write a test
    "B008",    # call in a default argument: common and intentional with Qt
    "RUF001",  # accents and em dashes in user-facing text
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# In tests, subprocesses and temporary paths are the subject under test.
"tests/*" = ["S105", "S106", "S108", "S603", "S607"]
# Packaging scripts only run on the machine doing the build.
"packaging/*" = ["S603", "S607", "T201"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
