# Compila e publica o instalador quando uma tag de versão é enviada.
#
#   git tag -a v1.3.0 -m "..." && git push origin v1.3.0
#
# Além de publicar o release, o workflow atualiza o instalador versionado na
# raiz do repositório — é de lá que a maioria das pessoas baixa.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: source-code

jobs:
  build:
    name: Compilar e publicar
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: source-code/requirements-dev.txt

      - name: Instalar as dependências
        run: pip install -r requirements-dev.txt

      # O FFmpeg tem ~200 MB e não muda entre execuções. Guardá-lo em cache
      # economiza vários minutos por release.
      - name: Restaurar o FFmpeg do cache
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: source-code/packaging/vendor/ffmpeg
          key: ffmpeg-essentials-${{ runner.os }}-v1

      - name: Baixar o FFmpeg
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: powershell -ExecutionPolicy Bypass -File packaging/fetch_ffmpeg.ps1

      - name: Instalar o WiX
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2

      - name: Conferir se a tag combina com a versão do código
        shell: pwsh
        run: |
          $codigo = python -c "import sys; sys.path.insert(0, '.'); import ytdownloader; print(ytdownloader.__version__)"
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          if ($tag -and $tag -ne $codigo) {
            throw "A tag ($tag) nao corresponde a versao do codigo ($codigo). Atualize source-code/ytdownloader/__init__.py."
          }
          Write-Host "Versao conferida: $codigo"

      - name: Compilar
        run: powershell -ExecutionPolicy Bypass -File packaging/build.ps1

      - name: Guardar o artefato
        id: artefatos
        uses: actions/upload-artifact@v4
        with:
          name: instalador
          path: source-code/dist/*.msi
          retention-days: 30

      # ── Assinatura de código ──────────────────────────────────────────
      # Sem assinatura, o SmartScreen mostra "Editor desconhecido" e afasta a
      # maior parte de quem baixa. O SignPath assina projetos de código aberto
      # sem custo — veja source-code/docs/ASSINATURA.md para o cadastro.
      #
      # A etapa só roda quando os segredos existirem. Enquanto não existirem, o
      # release sai sem assinatura em vez de falhar.
      - name: Verificar se a assinatura está configurada
        id: checar-assinatura
        shell: pwsh
        env:
          TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          $configurada = -not [string]::IsNullOrWhiteSpace($env:TOKEN)
          "configurada=$($configurada.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          if (-not $configurada) {
            Write-Warning "SIGNPATH_API_TOKEN ausente: o instalador saira sem assinatura."
          }

      - name: Assinar o instalador
        if: steps.checar-assinatura.outputs.configurada == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ytdownloader
          signing-policy-slug: release-signing
          artifact-configuration-slug: instalador
          github-artifact-id: ${{ steps.artefatos.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: source-code/dist

      - name: Publicar o release
        uses: softprops/action-gh-release@v2
        with:
          files: source-code/dist/*.msi
          generate_release_notes: true
          draft: false
          fail_on_unmatched_files: true
          body: |
            ## Como instalar

            Baixe o **`YouTubeDownloader-*-Setup.msi`** e abra com dois cliques.
            Não pede permissão de administrador e não é preciso instalar Python,
            FFmpeg nem nada além disso.

            Durante a instalação você escolhe se quer o atalho na Área de
            Trabalho. O do Menu Iniciar é criado sempre.

            Requisitos: Windows 10 ou 11 de 64 bits.

            ---

            ## Installation

            Download **`YouTubeDownloader-*-Setup.msi`** and double-click it.
            No administrator prompt, and no Python, FFmpeg or other
            dependencies to install.

            During setup you choose whether to create a Desktop shortcut. The
            Start Menu one is always created.

            Requires Windows 10 or 11, 64-bit.

      # O instalador versionado na raiz precisa acompanhar a versão publicada,
      # senão quem baixa por ali pega uma versão antiga sem perceber.
      - name: Atualizar o instalador na raiz do repositório
        shell: pwsh
        working-directory: .
        run: |
          $novo = Get-ChildItem source-code/dist -Filter *.msi | Select-Object -First 1
          if (-not $novo) { throw "Instalador nao encontrado." }

          Get-ChildItem . -Filter 'YouTubeDownloader-*-Setup.msi' | Remove-Item -Force
          Copy-Item $novo.FullName -Destination $novo.Name

          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          if (git diff --cached --quiet) {
            Write-Host 'O instalador na raiz ja estava atualizado.'
          } else {
            git commit -m "Atualiza o instalador para $($novo.BaseName -replace '-Setup$', '')"
            git push origin HEAD:main
          }
