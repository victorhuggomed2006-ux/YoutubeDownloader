# Builds and publishes the installer when a version tag is pushed.
#
#   git tag -a v1.3.0 -m "..." && git push origin v1.3.0
#
# Besides publishing the release, the workflow updates the installer kept in
# the repository root — that is where most people download it from.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: source-code

jobs:
  build:
    name: Build and publish
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: source-code/requirements-dev.txt

      - name: Install the dependencies
        run: pip install -r requirements-dev.txt

      # FFmpeg is ~200 MB and does not change between runs. Caching it
      # saves several minutes per release.
      - name: Restore FFmpeg from cache
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: source-code/packaging/vendor/ffmpeg
          key: ffmpeg-essentials-${{ runner.os }}-v1

      - name: Download FFmpeg
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: powershell -ExecutionPolicy Bypass -File packaging/fetch_ffmpeg.ps1

      - name: Install WiX
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2

      - name: Check the tag matches the version in the code
        shell: pwsh
        run: |
          $code = python -c "import sys; sys.path.insert(0, '.'); import ytdownloader; print(ytdownloader.__version__)"
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          if ($tag -and $tag -ne $code) {
            throw "The tag ($tag) does not match the version in the code ($code). Update source-code/ytdownloader/__init__.py."
          }
          Write-Host "Version checked: $code"

      - name: Build
        run: powershell -ExecutionPolicy Bypass -File packaging/build.ps1

      - name: Upload the artifact
        id: artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installer
          path: source-code/dist/*.msi
          retention-days: 30

      # ── Code signing ──────────────────────────────────────────────────
      # Unsigned, SmartScreen shows "Unknown publisher" and drives away most
      # of the people who download it. SignPath signs open source projects
      # free of charge — see source-code/docs/CODE-SIGNING.md to sign up.
      #
      # The step only runs once the secrets exist. Until then the release
      # ships unsigned rather than failing.
      - name: Check whether signing is configured
        id: check-signing
        shell: pwsh
        env:
          TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          $configured = -not [string]::IsNullOrWhiteSpace($env:TOKEN)
          "configured=$($configured.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          if (-not $configured) {
            Write-Warning "SIGNPATH_API_TOKEN missing: the installer will ship unsigned."
          }

      - name: Sign the installer
        if: steps.check-signing.outputs.configured == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ytdownloader
          signing-policy-slug: release-signing
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.artifacts.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: source-code/dist

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: source-code/dist/*.msi
          generate_release_notes: true
          draft: false
          fail_on_unmatched_files: true
          body: |
            ## Installation

            Download **`YouTubeDownloader-*-Setup.msi`** and double-click it.
            No administrator prompt, and no Python, FFmpeg or other
            dependencies to install.

            During setup you choose whether to create a Desktop shortcut. The
            Start Menu one is always created.

            Requires Windows 10 or 11, 64-bit.

      # The installer kept in the root must follow the published version,
      # or people downloading from there get an old build without noticing.
      - name: Update the installer in the repository root
        shell: pwsh
        working-directory: .
        run: |
          $new = Get-ChildItem source-code/dist -Filter *.msi | Select-Object -First 1
          if (-not $new) { throw "Installer not found." }

          Get-ChildItem . -Filter 'YouTubeDownloader-*-Setup.msi' | Remove-Item -Force
          Copy-Item $new.FullName -Destination $new.Name

          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          if (git diff --cached --quiet) {
            Write-Host 'The installer in the root was already up to date.'
          } else {
            git commit -m "Update the installer to $($new.BaseName -replace '-Setup$', '')"
            git push origin HEAD:main
          }
