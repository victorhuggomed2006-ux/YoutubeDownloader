# Checks every push and pull request: linter and tests.
#
# The whole Python project lives in source-code/, so the jobs run from
# there. The full installer build does not run here — it needs FFmpeg
# (~200 MB) and takes several minutes. That belongs to the release workflow.

name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "source-code/docs/**"
      - "LICENSE"
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # A new push cancels the previous check on the same branch.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: source-code

jobs:
  lint:
    name: Linter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Check the style
        run: ruff check --output-format=github .

      - name: Check the formatting
        run: ruff format --check .

  tests:
    name: Tests (Python ${{ matrix.python }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # The minimum supported version and the latest stable one. The ones
        # in between rarely break on their own and would double the wait.
        python: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: source-code/requirements-dev.txt

      - name: Install the dependencies
        run: pip install -r requirements-dev.txt

      - name: Run the tests
        run: pytest --cov --cov-report=xml --cov-report=term

      - name: Upload the coverage
        if: matrix.python == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: source-code/coverage.xml
          retention-days: 14

  build-check:
    name: Does the app open?
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: source-code/requirements-dev.txt

      - name: Install the dependencies
        run: pip install -r requirements-dev.txt

      - name: Generate icons and translations
        run: |
          python packaging/make_icon.py
          powershell -ExecutionPolicy Bypass -File packaging/build_translations.ps1 -CompileOnly

      # Without this Qt finds no graphics platform on the runner and the
      # window is never even created.
      - name: Open the window offscreen
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: .
        run: python -c "from PySide6.QtWidgets import QApplication; from PySide6.QtCore import QTimer; from ytdownloader.core.settings import SettingsStore; from ytdownloader.core.history import HistoryStore; from ytdownloader.gui.main_window import MainWindow; app = QApplication([]); w = MainWindow(SettingsStore(), HistoryStore()); w.show(); QTimer.singleShot(1500, app.quit); raise SystemExit(app.exec())"
