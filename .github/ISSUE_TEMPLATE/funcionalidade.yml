name: Feature request / Sugerir funcionalidade
description: Suggest something the application should do
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Write in English or Portuguese — both work.
        Escreva em inglês ou português, tanto faz.

  - type: textarea
    id: problema
    attributes:
      label: What problem does this solve? / Que problema isso resolve?
      description: |
        Describe the situation, not the solution. Knowing what you are trying
        to accomplish often reveals a better answer than the one first imagined.

        Descreva a situação, não a solução. Saber o que você quer alcançar
        costuma revelar uma resposta melhor do que a imaginada primeiro.
    validations:
      required: true

  - type: textarea
    id: proposta
    attributes:
      label: What do you have in mind? / O que você tem em mente?
    validations:
      required: true

  - type: textarea
    id: alternativas
    attributes:
      label: What do you do today? / O que você faz hoje?
      description: |
        How you work around it now, if at all.
        Como você contorna isso hoje, se contorna.
