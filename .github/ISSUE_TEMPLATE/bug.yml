name: Bug report
description: Something is not working as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Write in English, Portuguese or Spanish — whichever you are
        comfortable with.

  - type: input
    id: version
    attributes:
      label: Version
      description: Shown in the About window.
      placeholder: "1.3.0"
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - MSI installer
        - From source
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What you were trying to do, and what happened instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Paste this link: ...
        2. Choose MP4, 1080p
        3. Click Download
    validations:
      required: true

  - type: input
    id: link
    attributes:
      label: Video link
      description: |
        Only if the problem happens with a specific video. Skip it if the video
        is private.

  - type: textarea
    id: log
    attributes:
      label: Log
      description: |
        The relevant part of `%APPDATA%\YouTubeDownloader\ytdownloader.log`.
        It records the yt-dlp version in use, where FFmpeg was found and the
        actual error — usually enough to pinpoint the cause.
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I updated the download engine in Settings
          required: true
        - label: I searched the existing issues
          required: true
