name: Bug report / Relatar um problema
description: Something is not working as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Write in English or Portuguese — both work.
        Escreva em inglês ou português, tanto faz.

  - type: input
    id: versao
    attributes:
      label: Version / Versão
      description: Shown in the About window. / Aparece na janela Sobre.
      placeholder: "1.0.0"
    validations:
      required: true

  - type: dropdown
    id: instalacao
    attributes:
      label: How did you install it? / Como instalou?
      options:
        - Setup.exe installer
        - MSI package
        - From source / A partir do código-fonte
    validations:
      required: true

  - type: textarea
    id: descricao
    attributes:
      label: What happened? / O que aconteceu?
      description: |
        What you were trying to do, and what happened instead.
        O que você tentou fazer e o que aconteceu no lugar.
    validations:
      required: true

  - type: textarea
    id: passos
    attributes:
      label: Steps to reproduce / Como reproduzir
      placeholder: |
        1. Paste this link: ...
        2. Choose MP4, 1080p
        3. Click Download
    validations:
      required: true

  - type: input
    id: link
    attributes:
      label: Video link / Link do vídeo
      description: |
        Only if the problem happens with a specific video. Skip it if the video
        is private.
        Só se o problema acontece com um vídeo específico. Pule se for privado.

  - type: textarea
    id: log
    attributes:
      label: Log
      description: |
        The relevant part of `%APPDATA%\YouTubeDownloader\ytdownloader.log`.
        It records the yt-dlp version in use, where FFmpeg was found and the
        actual error — usually enough to pinpoint the cause.

        O trecho relevante de `%APPDATA%\YouTubeDownloader\ytdownloader.log`.
        Ele registra a versão do yt-dlp, onde o FFmpeg foi encontrado e o erro
        real — normalmente o bastante para achar a causa.
      render: text

  - type: checkboxes
    id: verificacoes
    attributes:
      label: Before submitting / Antes de enviar
      options:
        - label: I updated the download engine in Settings / Atualizei o motor de download em Configurações
          required: true
        - label: I searched the existing issues / Procurei nas issues existentes
          required: true
